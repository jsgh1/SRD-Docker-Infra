{
  "name": "srd-production",
  "services": {
    "gateway": {
      "build": {
        "context": ".",
        "dockerfile": "docker/php-production.Dockerfile",
        "args": {
          "SERVICE": "gateway"
        }
      },
      "environment": {
        "APP_NAME": "SRD-gateway",
        "APP_ENV": "production",
        "APP_DEBUG": "false",
        "APP_KEY": "${APP_KEY_GATEWAY:?Ejecuta scripts/Initialize.ps1}",
        "APP_URL": "https://${SRD_DOMAIN:?Define SRD_DOMAIN}",
        "APP_LOCALE": "es",
        "DB_CONNECTION": "mysql",
        "DB_HOST": "mysql",
        "DB_DATABASE": "srd_gateway",
        "DB_USERNAME": "srd_gateway",
        "DB_PASSWORD": "${DB_PASSWORD_GATEWAY:?Ejecuta scripts/Initialize.ps1}",
        "SESSION_DRIVER": "file",
        "SESSION_LIFETIME": "30",
        "SESSION_COOKIE": "srd_session",
        "SESSION_SAME_SITE": "strict",
        "SESSION_SECURE_COOKIE": "true",
        "CACHE_STORE": "file",
        "HASH_DRIVER": "argon",
        "MAIL_MAILER": "smtp",
        "MAIL_HOST": "${SMTP_HOST:?Define SMTP_HOST}",
        "MAIL_PORT": "${SMTP_PORT:-587}",
        "MAIL_FROM_ADDRESS": "${SMTP_FROM_ADDRESS:?Define SMTP_FROM_ADDRESS}",
        "MAIL_FROM_NAME": "SRD",
        "INTERNAL_KEY": "${INTERNAL_KEY:?Ejecuta scripts/Initialize.ps1}",
        "CHALLENGE_KEY": "${CHALLENGE_KEY:?Ejecuta scripts/Initialize.ps1}",
        "REVERB_APP_KEY": "${REVERB_APP_KEY:?Define REVERB_APP_KEY}",
        "REVERB_APP_ID": "${REVERB_APP_ID:?Define REVERB_APP_ID}",
        "REVERB_APP_SECRET": "${REVERB_APP_SECRET:?Ejecuta scripts/Initialize.ps1}",
        "WEBRTC_STUN_URL": "${WEBRTC_STUN_URL:-}",
        "WEBRTC_TURN_URL": "${WEBRTC_TURN_URL:-}",
        "WEBRTC_TURN_SECRET": "${WEBRTC_TURN_SECRET:-}",
        "PUBLIC_URL": "https://${SRD_DOMAIN:?Define SRD_DOMAIN}",
        "NOTIFICATIONS_URL": "http://notifications:8000",
        "TREASURY_URL": "http://treasury:8000",
        "INVENTORY_URL": "http://inventory:8000",
        "MAIL_SCHEME": "${SMTP_SCHEME:-smtp}",
        "MAIL_USERNAME": "${SMTP_USERNAME:?Define SMTP_USERNAME}",
        "MAIL_PASSWORD": "${SMTP_PASSWORD:?Define SMTP_PASSWORD}"
      },
      "networks": [
        "internal"
      ],
      "depends_on": {
        "mysql": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 5
      },
      "volumes": [
        "gateway_sessions:/app/services/gateway/storage/framework/sessions"
      ],
      "image": "srd-gateway:production",
      "logging": {
        "driver": "local",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "restart": "unless-stopped"
    },
