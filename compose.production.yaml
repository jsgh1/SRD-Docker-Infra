        "driver": "local",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "restart": "unless-stopped"
    },
    "identity-scheduler": {
      "environment": {
        "APP_NAME": "SRD-identity",
        "APP_ENV": "production",
        "APP_DEBUG": "false",
        "APP_KEY": "${APP_KEY_IDENTITY:?Ejecuta scripts/Initialize.ps1}",
        "APP_URL": "https://${SRD_DOMAIN:?Define SRD_DOMAIN}",
