        "CHALLENGE_KEY": "${CHALLENGE_KEY:?Ejecuta scripts/Initialize.ps1}",
        "PUBLIC_URL": "https://${SRD_DOMAIN:?Define SRD_DOMAIN}",
        "MAIL_SCHEME": "${SMTP_SCHEME:-smtp}",
        "MAIL_USERNAME": "${SMTP_USERNAME:?Define SMTP_USERNAME}",
        "MAIL_PASSWORD": "${SMTP_PASSWORD:?Define SMTP_PASSWORD}"
      },
      "networks": [
        "internal",
        "smtp_egress"
      ],
      "command": [
        "sh",
        "-c",
        "php artisan schedule:clear-cache && exec php artisan schedule:work"
      ],
      "depends_on": {
        "identity": {
          "condition": "service_healthy"
        },
        "audit": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "php",
          "-r",
          "$$p='storage/framework/scheduler-health/scheduler-heartbeat'; $$q='storage/framework/scheduler-health/outbox-heartbeat'; exit(is_file($$p) && is_file($$q) && time() - filemtime($$p) <= 180 && time() - filemtime($$q) <= 180 ? 0 : 1);"
        ],
        "interval": "30s",
        "timeout": "5s",
        "retries": 2,
        "start_period": "180s"
      },
      "volumes": [
        "scheduler_health_identity:/app/services/identity/storage/framework/scheduler-health"
      ],
      "image": "srd-identity:production",
      "user": "www-data",
      "logging": {
        "driver": "local",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "restart": "unless-stopped"
