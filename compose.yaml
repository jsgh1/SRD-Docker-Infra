        "APP_NAME": "SRD-chat-reverb",
        "APP_ENV": "local",
        "APP_DEBUG": "false",
        "APP_KEY": "${APP_KEY_CHAT:?Ejecuta scripts/Initialize.ps1}",
        "CACHE_STORE": "file",
        "REVERB_APP_ID": "srd-chat-local",
        "REVERB_APP_KEY": "srd-chat-local",
        "REVERB_APP_SECRET": "${REVERB_APP_SECRET:?Ejecuta scripts/Initialize.ps1}",
        "REVERB_HOST": "chat-reverb",
        "REVERB_PORT": "8080",
        "REVERB_SCHEME": "http"
      },
      "command": ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"],
      "networks": ["internal"],
      "healthcheck": {
        "test": ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) === false ? 1 : 0);"],
        "interval": "15s",
        "timeout": "5s",
        "retries": 5
      }
    },
    "chat-scheduler": {
      "build": {
        "context": ".",
        "dockerfile": "docker/php.Dockerfile",
        "args": {
          "SERVICE": "chat"
        }
      },
      "environment": {
        "APP_NAME": "SRD-chat",
        "APP_ENV": "local",
        "APP_DEBUG": "false",
        "APP_KEY": "${APP_KEY_CHAT:?Ejecuta scripts/Initialize.ps1}",
        "APP_URL": "http://localhost:8080",
        "APP_LOCALE": "es",
        "DB_CONNECTION": "mysql",
        "DB_HOST": "mysql",
        "DB_DATABASE": "srd_chat",
        "DB_USERNAME": "srd_chat",
        "DB_PASSWORD": "${DB_PASSWORD_CHAT:?Ejecuta scripts/Initialize.ps1}",
        "SESSION_DRIVER": "file",
        "SESSION_LIFETIME": "30",
        "SESSION_COOKIE": "srd_session",
        "SESSION_SAME_SITE": "strict",
        "SESSION_SECURE_COOKIE": "false",
        "CACHE_STORE": "file",
        "HASH_DRIVER": "argon",
        "MAIL_MAILER": "smtp",
        "MAIL_HOST": "mailpit",
        "MAIL_PORT": "1025",
        "MAIL_FROM_ADDRESS": "seguridad@srd.test",
        "MAIL_FROM_NAME": "SRD",
        "INTERNAL_KEY": "${INTERNAL_KEY:?Ejecuta scripts/Initialize.ps1}",
        "CHALLENGE_KEY": "${CHALLENGE_KEY:?Ejecuta scripts/Initialize.ps1}",
        "PUBLIC_URL": "http://localhost:8080"
      },
      "networks": [
        "internal"
      ],
      "command": ["sh", "-c", "php artisan schedule:clear-cache && exec php artisan schedule:work"],
      "depends_on": {
        "chat": {
          "condition": "service_healthy"
        },
        "audit": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": ["CMD", "php", "-r", "$$p='storage/framework/scheduler-health/scheduler-heartbeat'; $$q='storage/framework/scheduler-health/outbox-heartbeat'; exit(is_file($$p) && is_file($$q) && time() - filemtime($$p) <= 180 && time() - filemtime($$q) <= 180 ? 0 : 1);"],
        "interval": "30s",
        "timeout": "5s",
        "retries": 2,
        "start_period": "180s"
      },
      "volumes": ["scheduler_health_chat:/app/services/chat/storage/framework/scheduler-health"]
    }
  },
  "volumes": {
    "mysql_data": {},
    "gateway_sessions": {},
    "files_objects": {},
    "antivirus_signatures": {},
