        "SESSION_COOKIE": "srd_session",
        "SESSION_SAME_SITE": "strict",
        "SESSION_SECURE_COOKIE": "false",
        "CACHE_STORE": "file",
        "HASH_DRIVER": "argon",
        "MAIL_MAILER": "smtp",
        "MAIL_HOST": "mailpit",
        "MAIL_PORT": "1025",
        "MAIL_FROM_ADDRESS": "seguridad@srd.test",
        "MAIL_FROM_NAME": "SRD",
        "INTERNAL_KEY": "${INTERNAL_KEY:?Ejecuta scripts/Initialize.ps1}",
        "CHALLENGE_KEY": "${CHALLENGE_KEY:?Ejecuta scripts/Initialize.ps1}",
        "PUBLIC_URL": "http://localhost:8080"
      },
      "networks": [
        "internal"
      ],
      "command": ["sh", "-c", "php artisan schedule:clear-cache && exec php artisan schedule:work"],
      "depends_on": {
        "identity": {
          "condition": "service_healthy"
        },
        "audit": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": ["CMD", "php", "-r", "$$p='storage/framework/scheduler-health/scheduler-heartbeat'; $$q='storage/framework/scheduler-health/outbox-heartbeat'; exit(is_file($$p) && is_file($$q) && time() - filemtime($$p) <= 180 && time() - filemtime($$q) <= 180 ? 0 : 1);"],
        "interval": "30s",
        "timeout": "5s",
        "retries": 2,
        "start_period": "180s"
      },
      "volumes": ["scheduler_health_identity:/app/services/identity/storage/framework/scheduler-health"]
