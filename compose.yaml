    "scheduler_health_records": {},
    "scheduler_health_files": {},
    "scheduler_health_calendar": {},
    "scheduler_health_notifications": {},
    "scheduler_health_treasury": {},
    "scheduler_health_inventory": {},
    "scheduler_health_chat": {}
  },
  "networks": {
    "internal": {
      "internal": true
    },
    "local_access": {},
    "signature_updates": {}
  }
