server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws://localhost:8080; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    include /etc/nginx/srd-locations.conf;
}
