name: srd-files-api
services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: srd_files_probe
    networks: [isolated]
    mem_limit: 512m
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT 1' srd_files_probe >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 30
  files:
    image: srd-files:local
    build:
      context: ..
      dockerfile: docker/files.Dockerfile
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="
      INTERNAL_KEY: "synthetic-files-api-probe-key-not-for-deployment"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: srd_files_probe
      DB_USERNAME: root
      DB_PASSWORD: ""
      CACHE_STORE: file
      RECORDS_URL: "http://127.0.0.1:1"
      CLAMD_ADDRESS: "tcp://127.0.0.1:1"
    networks: [isolated]
    mem_limit: 384m
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  isolated:
    internal: true
