    location /app/ {
        set $srd_reverb chat-reverb;
        proxy_pass http://$srd_reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 90s;
    }
    location /api/ {
        set $srd_gateway gateway;
        proxy_pass http://$srd_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SRD-Context "";
        proxy_set_header X-Organization-ID "";
        proxy_set_header X-Role "";
    }
    location ~ ^/api/v1/persons/[0-9a-fA-F-]+/photos {
        client_max_body_size 8m;
        proxy_read_timeout 100s;
        set $srd_gateway gateway;
        proxy_pass http://$srd_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SRD-Context "";
        proxy_set_header X-Organization-ID "";
        proxy_set_header X-Role "";
    }
    location ~ ^/api/v1/assets/[0-9a-fA-F-]+/photos {
        client_max_body_size 8m;
        proxy_read_timeout 100s;
        set $srd_gateway gateway;
        proxy_pass http://$srd_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SRD-Context "";
        proxy_set_header X-Organization-ID "";
        proxy_set_header X-Role "";
    }
    location = /api/v1/folder-documents {
        client_max_body_size 29m;
        proxy_read_timeout 100s;
        set $srd_gateway gateway;
        proxy_pass http://$srd_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SRD-Context "";
        proxy_set_header X-Organization-ID "";
        proxy_set_header X-Role "";
    }
    location ~ ^/api/v1/conversations/[0-9a-fA-F-]+/messages$ {
        client_max_body_size 15m;
        proxy_read_timeout 100s;
        set $srd_gateway gateway;
        proxy_pass http://$srd_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SRD-Context "";
        proxy_set_header X-Organization-ID "";
        proxy_set_header X-Role "";
    }
    location ~ ^/api/v1/conversations/[0-9a-fA-F-]+/messages/[0-9a-fA-F-]+/attachment$ {
        proxy_read_timeout 90s;
        set $srd_gateway gateway;
        proxy_pass http://$srd_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SRD-Context "";
        proxy_set_header X-Organization-ID "";
        proxy_set_header X-Role "";
    }
    location / { try_files $uri $uri/ /index.html; }
